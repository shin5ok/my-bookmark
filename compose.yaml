services:
  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: ["gcloud", "emulators", "firestore", "start", "--host-port=0.0.0.0:8085", "--project=demo-bookmark", "--quiet"]
    ports:
      - "127.0.0.1:8085:8085"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s
